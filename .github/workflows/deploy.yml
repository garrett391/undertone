# Builds the site on GitHub's machines and publishes it to GitHub Pages.
#
# One-time setup: in the repo, go to Settings → Pages and set Source to
# "GitHub Actions". No gh-pages branch needed, and dist stays out of the repo.
#
# Note there is no Last.fm key here on purpose. Vite inlines VITE_ variables
# into the bundle at build time, so a key added as a repo secret would still be
# readable by anyone who opens the published JavaScript. Visitors paste their
# own key instead, and it stays in their browser.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Also lets you trigger a deploy by hand from the Actions tab.

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
